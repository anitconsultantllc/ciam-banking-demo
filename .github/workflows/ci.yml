name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  infra:
    name: Infrastructure config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: cp .env.example .env && docker compose --profile all config --quiet
      - name: Validate Keycloak realm JSON
        run: python3 -m json.tool infra/keycloak/realm-bank.json > /dev/null
      - name: Lint shell scripts
        run: shellcheck infra/**/*.sh

  java:
    name: Java build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # verify = compile + unit tests + integration tests (Testcontainers) + ArchUnit
      - run: ./mvnw -B verify

  # .NET, frontend and end-to-end jobs are added in Phases 4-7.
